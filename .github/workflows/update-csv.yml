name: Actualizar CSVs de fútbol

"on":
  schedule:
    - cron: "0 3 * * *"  # 3 AM UTC diario
  workflow_dispatch: {}    # permite disparar manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests polars-lts-cpu python-dotenv

      - name: Ejecutar actualización de CSVs
        run: python src/scripts/update_daily_csv.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/*.csv
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que commitear"
          else
            git commit -m "Auto: actualizar datos de futbol $(date -u +%Y-%m-%d)"
            git push origin main
          fi
