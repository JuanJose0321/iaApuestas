[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betbrain"
version = "1.0.0"
description = "AI-powered sports betting analysis system"
requires-python = ">=3.9"
dependencies = [
    "flask==3.1.3",
    "flask-limiter==4.1.1",
    "waitress==3.0.2",
    "python-dotenv==1.2.2",
    "requests==2.32.5",
    "supabase==2.31.0",
    "groq==1.0.0",
    "scikit-learn==1.8.0",
    "numpy==2.4.2",
    "pandas==3.0.1",
    "scipy==1.17.1",
    "joblib==1.5.3",
    "xgboost==3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["Lib", "Scripts", "Include", ".git", "diagnostics", "data", "models"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["Lib/", "Scripts/", "Include/"]
